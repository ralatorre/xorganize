# Keeps every dependency on its latest release (CONTRIBUTING, "Latest versions").
# Each update is a pull request, checked like a new dependency before merging.
# Updates wait three days after a release, as pnpm-workspace.yaml requires;
# security updates do not wait. Nothing here blocks a merge.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 3
    versioning-strategy: increase
    groups:
      # Minor and patch updates in one pull request; each major on its own.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 is skipped.
      - dependency-name: typescript
        versions: ['7.x']
      # Node is on its LTS line; odd-numbered majors never become LTS.
      - dependency-name: '@types/node'
        versions: ['27.x', '29.x']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 3

  # The development image's Node base (container/Containerfile).
  - package-ecosystem: docker
    directory: /container
    schedule:
      interval: daily
    cooldown:
      default-days: 3
